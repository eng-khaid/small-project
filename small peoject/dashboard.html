<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Welcome 👋</h1>

    <h2 class="title">What you will do</h2>

    <div class="box">

      <div class="card" onclick="showMessage('Instruction Team')">
        Meet the instructional team
      </div>

      <div class="card" onclick="showMessage('Program Structure')">
        Review the program structure
      </div>

      <div class="card" onclick="showMessage('HTML Examples')">
        See beginner-friendly HTML examples
      </div>

    </div>

    <div class="alerts">

      <div class="alert info" onclick="changeColor(this)">
        ℹ️ Information
      </div>

      <div class="alert error" onclick="changeColor(this)">
        ❌ Error
      </div>

      <div class="alert warning" onclick="changeColor(this)">
        ⚠️ Warning
      </div>

      <div class="alert success" onclick="changeColor(this)">
        ✅ Success
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
