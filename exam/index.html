<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechBootcamp</title>

  <link rel="stylesheet" href="sty.css">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>TechBootcamp</h1>
      <p>Start your journey in web development</p>
    </div>

    <!-- FORM -->
    <div class="form-box">

      <h2>Login Form</h2>

      <form>

        <div class="input-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="buttons">
          <button type="submit" class="btn send">Send</button>
          <button type="reset" class="btn delete">Delete</button>
        </div>

      </form>

    </div>

    <!-- CONTENT -->
    <h2 class="title">What you will do</h2>

    <div class="box">
      <div class="card">Meet the instructional team</div>
      <div class="card">Review the program structure</div>
      <div class="card">See beginner-friendly HTML examples</div>
    </div>

    <!-- ALERTS -->
    <div class="alerts">

      <div class="alert info">
        ℹ️ Information Message
      </div>

      <div class="alert error">
        ❌ Error Message
      </div>

      <div class="alert warning">
        ⚠️ Warning Message
      </div>

      <div class="alert success">
        ✅ Success Message
      </div>

    </div>

  </div>

</body>
</html>
